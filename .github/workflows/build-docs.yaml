# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
name: "Build documentation"

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches:
      - mistress

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # ratchet:cachix/install-nix-action@v30
        with:
          install_url: https://releases.nixos.org/nix/nix-2.26.3/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build site
        run: "nix build ./dev#search"

      - name: Upload built site as artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # ratchet:actions/upload-pages-artifact@v3
        with:
          path: ./result

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # ratchet:actions/deploy-pages@v4
